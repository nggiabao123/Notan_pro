<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d11" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Notan Pro — Tính Điểm & Mục Tiêu Học Tập (Thông tư 22)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <!-- Thêm liên kết Manifest & Apple Touch Icon -->
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <!-- Đăng ký Service Worker lưu bộ nhớ đệm -->
<script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch((err) => {
          console.warn('[PWA] Service Worker đăng ký thất bại:', err);
        });
      });
    }
  </script>
</head>
<body>
  <div class="app-container">
    <!-- Top Brand Bar -->
    <header class="topbar">
      <div class="brand">
        <div class="brand-logo">N</div>
        <div>
          <h1 class="brand-title">Notan Pro</h1>
          <span class="brand-sub">Chuẩn Thông tư 22/2021/TT-BGDĐT</span>
        </div>
      </div>

      <div class="topbar-actions">
        <button type="button" id="btn-sound-toggle" class="icon-btn active" title="Bật/Tắt âm thanh phản hồi">
          <span id="sound-icon-wrap" style="display: inline-flex; align-items: center;"></span>
          <span class="btn-label-desktop" id="sound-label-text">Âm thanh</span>
        </button>

        <button type="button" id="btn-open-backup" class="icon-btn" title="Sao lưu & Khôi phục dữ liệu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <span class="btn-label-desktop">Sao lưu</span>
        </button>

        <button type="button" id="btn-open-add-subject" class="icon-btn primary" title="Thêm môn học mới">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          <span class="btn-label-desktop">Thêm môn</span>
        </button>
      </div>
    </header>

    <!-- Sticky / Compact Semester Summary Card -->
    <section class="summary-card" aria-label="Tổng kết học kỳ">
      <div class="summary-top">
        <div class="summary-metrics">
          <div class="overall-score-wrap">
            <span class="summary-label">ĐTB Học kỳ</span>
            <div id="overall-avg-text" class="overall-score tabular">--</div>
          </div>
          <div id="semester-rank-badge" class="rank-badge">Chưa xếp loại</div>
        </div>

        <!-- Rounding Buffer Toggle -->
        <div
          id="rounding-toggle"
          class="rounding-control"
          role="switch"
          aria-checked="true"
          tabindex="0"
          title="Khi bật, mục tiêu 8.0 chỉ cần đạt 7.95 (tận dụng quy tắc làm tròn 1 chữ số thập phân)"
        >
          <div class="rounding-text">
            <span class="rounding-title">Đệm làm tròn (-0.05)</span>
            <span class="rounding-desc" id="rounding-desc-text">Đang bật: 7.95 &#8594; 8.0</span>
          </div>
          <div class="switch"></div>
        </div>
      </div>

      <!-- Semester Progress Track -->
      <div class="progress-wrapper">
        <div class="progress-track">
          <div id="overall-progress-fill" class="progress-fill" style="width: 0%;"></div>
          <!-- Mốc 5.0 (Đạt) -->
          <div class="progress-marker" style="left: 50%;">
            <span class="progress-marker-label tabular">5.0</span>
          </div>
          <!-- Mốc 6.5 (Khá) -->
          <div class="progress-marker" style="left: 65%;">
            <span class="progress-marker-label tabular">6.5</span>
          </div>
          <!-- Mốc 8.0 (Tốt) -->
          <div class="progress-marker" style="left: 80%;">
            <span class="progress-marker-label tabular">8.0</span>
          </div>
        </div>
      </div>

      <div id="summary-warnings" class="summary-warnings"></div>
    </section>

    <!-- Section Toolbar -->
    <div class="section-header">
      <h2 class="section-title">Bảng điểm các môn (<span id="subject-count-badge" class="tabular">0</span>)</h2>
      <span class="quick-tip">Mẹo: Gõ <strong>85</strong> &#8594; <strong>8.5</strong> &bull; Chạm ổ khóa để ghim điểm dự đoán</span>
    </div>

    <!-- Subject Cards Grid -->
    <main id="subjects-grid" class="subjects-grid"></main>
  </div>

  <!-- Modal 1: Thêm môn học mới -->
  <div id="add-subject-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="add-modal-title" class="modal-title">Thêm môn học mới</h3>
        <button type="button" class="modal-close" data-close-modal="add-subject-modal" aria-label="Đóng">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="add-subject-form">
        <div class="form-group">
          <label class="form-label" for="new-subject-name">Tên môn học</label>
          <input
            type="text"
            id="new-subject-name"
            class="text-input"
            placeholder="Ví dụ: Sinh học, GDKT & PL, Công nghệ..."
            maxlength="40"
            required
          />
        </div>
        <div class="form-group">
          <label class="form-label" for="new-subject-tx-count">Số cột điểm Thường xuyên (Hệ số 1)</label>
          <input
            type="number"
            id="new-subject-tx-count"
            class="text-input tabular"
            min="1"
            max="8"
            value="3"
            required
          />
        </div>
        <div class="modal-actions">
          <button type="button" class="btn" data-close-modal="add-subject-modal">Hủy</button>
          <button type="submit" class="btn btn-emerald">Thêm môn học</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2: Sao lưu & Khôi phục Base64 + DJB2 Checksum -->
  <div id="backup-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="backup-modal-title">
    <div class="modal-panel">
      <div class="modal-header">
        <h3 id="backup-modal-title" class="modal-title">Sao lưu &amp; Quản lý dữ liệu</h3>
        <button type="button" class="modal-close" data-close-modal="backup-modal" aria-label="Đóng">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="form-group">
        <label class="form-label" for="backup-code-textarea">Mã sao lưu (Base64 + DJB2 Checksum)</label>
        <textarea
          id="backup-code-textarea"
          class="textarea-input"
          placeholder="Nhấn 'Tạo mã sao lưu' để copy hoặc dán mã sao lưu vào đây để khôi phục..."
        ></textarea>
      </div>

      <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px;">
        <button type="button" id="btn-export-code" class="btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
          </svg>
          Copy mã sao lưu
        </button>
        <button type="button" id="btn-import-code" class="btn btn-emerald">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
          Khôi phục từ mã
        </button>
      </div>

      <div class="modal-actions" style="justify-content: space-between; border-top: 1px solid var(--border-subtle); padding-top: 14px;">
        <button type="button" id="btn-reset-all" class="btn btn-danger">Khôi phục 8 môn mặc định</button>
        <button type="button" class="btn" data-close-modal="backup-modal">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Core Engine Script -->
  <script src="engine.js"></script>

  <!-- UI Controller & Instant In-Place DOM Patching Script -->
  <script>
    (function () {
      'use strict';

      const UI_PREFS_KEY = 'notan_pro_ui_prefs_v1';
      const PRESET_TARGETS = [5.0, 6.5, 8.0, 9.0];

      // Trạng thái giao diện
      const uiState = {
        useRoundingBuffer: true,
        soundEnabled: true,
        collapsedMap: {}
      };

      // Tải cấu hình UI từ localStorage
      function loadUiPrefs() {
        try {
          const raw = localStorage.getItem(UI_PREFS_KEY);
          if (!raw) return;
          const parsed = JSON.parse(raw);
          if (typeof parsed.useRoundingBuffer === 'boolean') {
            uiState.useRoundingBuffer = parsed.useRoundingBuffer;
          }
          if (typeof parsed.soundEnabled === 'boolean') {
            uiState.soundEnabled = parsed.soundEnabled;
          }
          if (parsed.collapsedMap && typeof parsed.collapsedMap === 'object') {
            uiState.collapsedMap = parsed.collapsedMap;
          }
        } catch (err) {
          // Bỏ qua lỗi đọc prefs
        }
      }

      function saveUiPrefs() {
        try {
          localStorage.setItem(UI_PREFS_KEY, JSON.stringify(uiState));
        } catch (err) {
          // Bỏ qua
        }
      }

      // Phát âm thanh phản hồi nếu người dùng bật âm thanh
      function playSound(type) {
        if (!uiState.soundEnabled) return;
        if (window.GradeEngine && typeof window.GradeEngine.playFeedbackSound === 'function') {
          window.GradeEngine.playFeedbackSound(type);
        }
      }

      // Hiển thị Toast thông báo nhanh
      let toastTimer = null;
      function showToast(message) {
        const toastEl = document.getElementById('toast');
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.classList.add('show');
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.remove('show');
        }, 2300);
      }

      // Biểu tượng SVG dùng chung
      const ICONS = {
        lockClosed: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>`,
        lockOpen: `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 9.9-1"></path></svg>`,
        soundOn: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>`,
        soundOff: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`,
        chevronDown: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>`,
        trash: `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`
      };

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Định dạng hiển thị điểm trong ô input
      function formatScoreDisplay(val) {
        if (val === null || val === undefined || val === '') return '';
        const num = Number(val);
        if (Number.isNaN(num)) return '';
        return String(Math.round(num * 100) / 100);
      }

      // Định dạng điểm gợi ý 1 chữ số thập phân
      function formatSuggestionDisplay(val) {
        if (val === null || val === undefined || val === '') return '';
        const num = Number(val);
        if (Number.isNaN(num)) return '';
        return num.toFixed(1);
      }

      // Màu sắc theo mức điểm
      function getScoreColor(score) {
        if (score === null || score === undefined || Number.isNaN(Number(score))) {
          return 'var(--text-muted)';
        }
        const n = Number(score);
        if (n >= 8.0) return 'var(--emerald)';
        if (n >= 6.5) return 'var(--amber)';
        if (n >= 5.0) return '#60a5fa';
        return 'var(--coral)';
      }

      // Phân loại màu sắc cho gợi ý điểm (safe / effort / impossible)
      function getSuggestionTone(calcResult, cellSuggestedScore) {
        if (!calcResult) return '';
        if (calcResult.status === 'impossible') return 'impossible';
        if (calcResult.status === 'achieved') return 'safe';
        const s = cellSuggestedScore !== null && cellSuggestedScore !== undefined ? Number(cellSuggestedScore) : calcResult.minScore;
        if (s > 8.0) return 'effort';
        return 'safe';
      }

      // Tạo nội dung thanh thông báo gợi ý trong từng môn học
      function buildBannerData(subject, calcResult) {
        if (!calcResult || subject.target === null) {
          return { visible: false, className: 'suggestion-banner', html: '' };
        }

        const targetStr = Number(subject.target).toFixed(1);

        if (calcResult.status === 'achieved') {
          return {
            visible: true,
            className: 'suggestion-banner safe',
            html: `<span>&#10003; Đã chắc chắn đạt mục tiêu <strong>${targetStr}</strong>!</span><span class="tabular">Tối đa có thể đạt: <strong>${calcResult.maxPossibleAvg.toFixed(1)}</strong></span>`
          };
        }

        if (calcResult.status === 'impossible') {
          return {
            visible: true,
            className: 'suggestion-banner impossible',
            html: `<span>&#9888; Không thể đạt <strong>${targetStr}</strong> dù các cột còn lại được 10.</span><span class="tabular">Tối đa đạt được: <strong>${calcResult.maxPossibleAvg.toFixed(1)}</strong></span>`
          };
        }

        const minStr = calcResult.minScore.toFixed(1);
        const tone = calcResult.minScore > 8.0 ? 'effort' : 'safe';
        const prefix = tone === 'effort' ? 'Cần nỗ lực cao:' : 'Khả thi:';

        return {
          visible: true,
          className: `suggestion-banner ${tone}`,
          html: `<span>${prefix} Mỗi cột trống cần tối thiểu <strong class="tabular">${minStr}</strong> điểm để đạt <strong class="tabular">${targetStr}</strong></span><span class="tabular">Trần tối đa: <strong>${calcResult.maxPossibleAvg.toFixed(1)}</strong></span>`
        };
      }

      // Tính số cột đã nhập của 1 môn
      function getFilledMetaText(subject) {
        const txLen = Array.isArray(subject.tx) ? subject.tx.length : 3;
        const filledTx = Array.isArray(subject.tx)
          ? subject.tx.filter((v) => v !== null && v !== undefined && v !== '').length
          : 0;
        const hasGk = subject.gk !== null && subject.gk !== undefined && subject.gk !== '';
        const hasCk = subject.ck !== null && subject.ck !== undefined && subject.ck !== '';
        const totalCols = txLen + 2;
        const filledCols = filledTx + (hasGk ? 1 : 0) + (hasCk ? 1 : 0);
        return `Đã nhập ${filledCols}/${totalCols} cột điểm (${txLen} TX • 1 GK • 1 CK)`;
      }

      // =========================================================================
      // CẬP NHẬT HEADER TỔNG KẾT HỌC KỲ & CONTROL TRạng THÁI
      // =========================================================================

      function updateSoundButtonUI() {
        const btn = document.getElementById('btn-sound-toggle');
        const iconWrap = document.getElementById('sound-icon-wrap');
        const labelText = document.getElementById('sound-label-text');
        if (!btn || !iconWrap) return;

        if (uiState.soundEnabled) {
          btn.classList.add('active');
          iconWrap.innerHTML = ICONS.soundOn;
          if (labelText) labelText.textContent = 'Âm thanh: Bật';
        } else {
          btn.classList.remove('active');
          iconWrap.innerHTML = ICONS.soundOff;
          if (labelText) labelText.textContent = 'Âm thanh: Tắt';
        }
      }

      function updateRoundingToggleUI() {
        const toggleEl = document.getElementById('rounding-toggle');
        const descEl = document.getElementById('rounding-desc-text');
        if (!toggleEl) return;
        toggleEl.setAttribute('aria-checked', String(uiState.useRoundingBuffer));
        if (descEl) {
          descEl.innerHTML = uiState.useRoundingBuffer
            ? 'Đang bật: 7.95 &#8594; 8.0'
            : 'Đang tắt: Chuẩn tuyệt đối 8.00';
        }
      }

      function updateSemesterSummaryDOM() {
        const subjects = GradeEngine.getSubjects();
        const summary = GradeEngine.calculateSemesterSummary(subjects);

        const countBadge = document.getElementById('subject-count-badge');
        if (countBadge) countBadge.textContent = String(subjects.length);

        const avgEl = document.getElementById('overall-avg-text');
        const rankBadgeEl = document.getElementById('semester-rank-badge');
        const progressFillEl = document.getElementById('overall-progress-fill');
        const warningsEl = document.getElementById('summary-warnings');

        if (avgEl) {
          if (summary.overallAvg !== null) {
            avgEl.textContent = summary.overallAvg.toFixed(1);
            avgEl.style.color = getScoreColor(summary.overallAvg);
          } else {
            avgEl.textContent = '--';
            avgEl.style.color = 'var(--text-primary)';
          }
        }

        if (rankBadgeEl) {
          rankBadgeEl.textContent = `Học lực: ${summary.rank}`;
          rankBadgeEl.className = 'rank-badge';
          if (summary.rank === 'Tốt') {
            rankBadgeEl.classList.add('rank-good');
          } else if (summary.rank === 'Khá') {
            rankBadgeEl.classList.add('rank-fair');
          } else if (summary.rank === 'Đạt') {
            rankBadgeEl.classList.add('rank-pass');
          } else if (summary.rank === 'Chưa đạt') {
            rankBadgeEl.classList.add('rank-warn');
          }
        }

        if (progressFillEl) {
          const pct = summary.overallAvg !== null ? Math.min(100, Math.max(0, summary.overallAvg * 10)) : 0;
          progressFillEl.style.width = `${pct}%`;
          progressFillEl.style.backgroundColor = summary.overallAvg !== null ? getScoreColor(summary.overallAvg) : 'var(--emerald)';
        }

        if (warningsEl) {
          if (!summary.warningSubjects || summary.warningSubjects.length === 0) {
            if (summary.overallAvg === null) {
              warningsEl.innerHTML = `<span>Nhập điểm hoặc chọn mục tiêu môn học để xem dự báo xếp loại học lực cả kỳ.</span>`;
            } else if (summary.rank === 'Tốt') {
              warningsEl.innerHTML = `<span style="color: var(--emerald); font-weight: 600;">&#10024; Tất cả các môn đều thỏa điều kiện danh hiệu Học sinh Giỏi / Học lực Tốt!</span>`;
            } else {
              warningsEl.innerHTML = '';
            }
          } else {
            const chipsHtml = summary.warningSubjects
              .map(
                (w) =>
                  `<span class="warning-chip tabular" title="${escapeHtml(w.reason)}">${escapeHtml(w.name)}: ${escapeHtml(w.reason)}</span>`
              )
              .join('');
            warningsEl.innerHTML = `<span>Cần cải thiện:</span> ${chipsHtml}`;
          }
        }
      }

      // =========================================================================
      // INSTANT IN-PLACE DOM PATCHING (CẬP NHẬT TỨC THÌ KHÔNG MẤT FOCUS)
      // =========================================================================

      /**
       * Cập nhật trực tiếp các phần tử hiển thị bên trong 1 thẻ môn học (.subject-card)
       * Tuyệt đối không ghi đè innerHTML của các ô <input> đang được focus.
       */
      function patchSubjectCardDOM(subjectId, options = { syncInputValues: false }) {
        const subject = GradeEngine.getSubjectById(subjectId);
        const card = document.querySelector(`.subject-card[data-subject-id="${CSS.escape(String(subjectId))}"]`);
        if (!subject || !card) return;

        const currentAvg = GradeEngine.calculateCurrentAvg(subject);
        const calcResult = GradeEngine.calculateTargetSuggestions(subject, uiState.useRoundingBuffer);

        // 1. Trạng thái viền thẻ nếu không thể đạt mục tiêu
        card.classList.toggle('status-impossible', Boolean(calcResult && calcResult.status === 'impossible'));

        // 2. Cập nhật huy hiệu mục tiêu (Target Pill) trên Header
        const targetPillEl = card.querySelector('[data-role="target-pill"]');
        if (targetPillEl) {
          if (subject.target !== null && subject.target !== undefined && subject.target !== '') {
            targetPillEl.style.display = 'inline-flex';
            targetPillEl.textContent = `Mục tiêu: ${Number(subject.target).toFixed(1)}`;
          } else {
            targetPillEl.style.display = 'none';
            targetPillEl.textContent = '';
          }
        }

        // 3. Cập nhật dòng Meta số cột đã nhập
        const metaEl = card.querySelector('[data-role="subject-meta"]');
        if (metaEl) {
          metaEl.textContent = getFilledMetaText(subject);
        }

        // 4. Cập nhật điểm Trung bình môn (TBM) hiện tại
        const avgEl = card.querySelector('[data-role="subject-avg"]');
        if (avgEl) {
          if (currentAvg !== null) {
            avgEl.textContent = currentAvg.toFixed(1);
            avgEl.style.color = getScoreColor(currentAvg);
          } else {
            avgEl.textContent = '--';
            avgEl.style.color = 'var(--text-muted)';
          }
        }

        // 5. Cập nhật thanh tiến độ nhỏ của môn
        const miniFillEl = card.querySelector('[data-role="mini-fill"]');
        if (miniFillEl) {
          const pct = currentAvg !== null ? Math.min(100, Math.max(0, currentAvg * 10)) : 0;
          miniFillEl.style.width = `${pct}%`;
          miniFillEl.style.backgroundColor = currentAvg !== null ? getScoreColor(currentAvg) : 'var(--border-subtle)';
        }

        const miniTickEl = card.querySelector('[data-role="mini-tick"]');
        if (miniTickEl) {
          if (subject.target !== null && subject.target !== undefined) {
            miniTickEl.style.display = 'block';
            miniTickEl.style.left = `${Math.min(100, Math.max(0, Number(subject.target) * 10))}%`;
          } else {
            miniTickEl.style.display = 'none';
          }
        }

        // 6. Cập nhật trạng thái các nút chọn nhanh Mục tiêu (Preset Buttons)
        const presetBtns = card.querySelectorAll('.preset-btn[data-preset-target]');
        presetBtns.forEach((btn) => {
          const presetVal = parseFloat(btn.getAttribute('data-preset-target'));
          const isActive = subject.target !== null && Math.abs(Number(subject.target) - presetVal) < 0.001;
          btn.classList.toggle('active', isActive);
        });

        const customTargetInput = card.querySelector('.custom-target-input');
        if (customTargetInput && document.activeElement !== customTargetInput) {
          customTargetInput.value = subject.target !== null ? formatScoreDisplay(subject.target) : '';
        }

        // 7. Cập nhật Banner thông báo khả năng đạt mục tiêu
        const bannerEl = card.querySelector('[data-role="suggestion-banner"]');
        if (bannerEl) {
          const bannerData = buildBannerData(subject, calcResult);
          if (bannerData.visible) {
            bannerEl.style.display = 'flex';
            bannerEl.className = bannerData.className;
            bannerEl.innerHTML = bannerData.html;
          } else {
            bannerEl.style.display = 'none';
            bannerEl.innerHTML = '';
          }
        }

        // 8. Cập nhật từng ô điểm (TX, GK, CK): trạng thái khóa, nút khóa và điểm gợi ý mờ (.ghost-suggestion)
        const locksObj = subject.locks || subject.locked || { tx: [], gk: false, ck: false };
        const cells = card.querySelectorAll('.score-cell');

        cells.forEach((cell) => {
          const type = cell.getAttribute('data-score-type');
          const txIdx = parseInt(cell.getAttribute('data-tx-index') || '0', 10);

          let actualScore = null;
          let isLocked = false;
          let suggestedScore = null;

          if (type === 'tx') {
            actualScore = subject.tx[txIdx];
            isLocked = Boolean(Array.isArray(locksObj.tx) && locksObj.tx[txIdx]);
            suggestedScore = calcResult && calcResult.suggestedScores && Array.isArray(calcResult.suggestedScores.tx)
              ? calcResult.suggestedScores.tx[txIdx]
              : null;
          } else if (type === 'gk') {
            actualScore = subject.gk;
            isLocked = Boolean(locksObj.gk);
            suggestedScore = calcResult && calcResult.suggestedScores ? calcResult.suggestedScores.gk : null;
          } else if (type === 'ck') {
            actualScore = subject.ck;
            isLocked = Boolean(locksObj.ck);
            suggestedScore = calcResult && calcResult.suggestedScores ? calcResult.suggestedScores.ck : null;
          }

          const hasActualScore = actualScore !== null && actualScore !== undefined && actualScore !== '';

          // Đồng bộ class .is-locked trên .score-cell
          cell.classList.toggle('is-locked', isLocked && !hasActualScore);

          // Đồng bộ giá trị input nếu được yêu cầu và ô đó không đang được gõ
          const inputEl = cell.querySelector('.score-input');
          if (inputEl && options.syncInputValues && document.activeElement !== inputEl) {
            inputEl.value = hasActualScore ? formatScoreDisplay(actualScore) : '';
          }

          // Đồng bộ lớp phủ gợi ý mờ (.ghost-suggestion)
          const ghostEl = cell.querySelector('.ghost-suggestion');
          if (ghostEl) {
            if (!hasActualScore && suggestedScore !== null && suggestedScore !== undefined) {
              ghostEl.textContent = formatSuggestionDisplay(suggestedScore);
              const tone = getSuggestionTone(calcResult, suggestedScore);
              ghostEl.className = `ghost-suggestion tabular ${tone}`;
            } else {
              ghostEl.textContent = '';
              ghostEl.className = 'ghost-suggestion tabular';
            }
          }

          // Đồng bộ nút Khóa (chỉ hiển thị khi ô chưa có điểm thực tế và có điểm gợi ý hoặc đang khóa)
          const lockBtn = cell.querySelector('.lock-btn');
          if (lockBtn) {
            const showLockBtn = !hasActualScore && (isLocked || (suggestedScore !== null && suggestedScore !== undefined));
            lockBtn.style.display = showLockBtn ? 'grid' : 'none';
            lockBtn.innerHTML = isLocked ? ICONS.lockClosed : ICONS.lockOpen;
            lockBtn.title = isLocked
              ? 'Bỏ khóa điểm dự đoán này'
              : 'Khóa mức điểm dự đoán này để tính các cột còn lại';
            if (suggestedScore !== null && suggestedScore !== undefined) {
              lockBtn.setAttribute('data-suggested-score', String(suggestedScore));
            } else {
              lockBtn.removeAttribute('data-suggested-score');
            }
          }
        });
      }

      // =========================================================================
      // DỰNG HTML BAN ĐẦU CHO CÁC THẺ MÔN HỌC
      // =========================================================================

      function renderScoreCellHTML(subject, type, txIndex, labelText, calcResult) {
        const locksObj = subject.locks || subject.locked || { tx: [], gk: false, ck: false };

        let actualScore = null;
        let isLocked = false;
        let suggestedScore = null;

        if (type === 'tx') {
          actualScore = subject.tx[txIndex];
          isLocked = Boolean(Array.isArray(locksObj.tx) && locksObj.tx[txIndex]);
          suggestedScore = calcResult && calcResult.suggestedScores && Array.isArray(calcResult.suggestedScores.tx)
            ? calcResult.suggestedScores.tx[txIndex]
            : null;
        } else if (type === 'gk') {
          actualScore = subject.gk;
          isLocked = Boolean(locksObj.gk);
          suggestedScore = calcResult && calcResult.suggestedScores ? calcResult.suggestedScores.gk : null;
        } else if (type === 'ck') {
          actualScore = subject.ck;
          isLocked = Boolean(locksObj.ck);
          suggestedScore = calcResult && calcResult.suggestedScores ? calcResult.suggestedScores.ck : null;
        }

        const hasActualScore = actualScore !== null && actualScore !== undefined && actualScore !== '';
        const lockedClass = isLocked && !hasActualScore ? 'is-locked' : '';
        const tone = getSuggestionTone(calcResult, suggestedScore);
        const ghostText = !hasActualScore && suggestedScore !== null && suggestedScore !== undefined
          ? formatSuggestionDisplay(suggestedScore)
          : '';
        const showLockBtn = !hasActualScore && (isLocked || (suggestedScore !== null && suggestedScore !== undefined));

        return `
          <div class="score-cell ${lockedClass}" data-score-type="${type}" data-tx-index="${txIndex}">
            <span class="cell-sub-label">${labelText}</span>
            <button
              type="button"
              class="lock-btn"
              data-action="toggle-lock"
              data-subject-id="${escapeHtml(subject.id)}"
              data-score-type="${type}"
              data-tx-index="${txIndex}"
              ${suggestedScore !== null && suggestedScore !== undefined ? `data-suggested-score="${suggestedScore}"` : ''}
              style="display: ${showLockBtn ? 'grid' : 'none'};"
              title="${isLocked ? 'Bỏ khóa điểm dự đoán này' : 'Khóa mức điểm dự đoán này'}"
            >
              ${isLocked ? ICONS.lockClosed : ICONS.lockOpen}
            </button>
            <div class="score-input-wrap">
              <input
                type="text"
                inputmode="decimal"
                autocomplete="off"
                maxlength="4"
                placeholder=" "
                class="score-input tabular"
                data-subject-id="${escapeHtml(subject.id)}"
                data-score-type="${type}"
                data-tx-index="${txIndex}"
                value="${hasActualScore ? formatScoreDisplay(actualScore) : ''}"
                aria-label="${escapeHtml(subject.name)} - ${labelText}"
              />
              <div class="ghost-suggestion tabular ${tone}">${ghostText}</div>
            </div>
          </div>
        `;
      }

      function renderSubjectCardHTML(subject) {
        const currentAvg = GradeEngine.calculateCurrentAvg(subject);
        const calcResult = GradeEngine.calculateTargetSuggestions(subject, uiState.useRoundingBuffer);
        const isCollapsed = Boolean(uiState.collapsedMap[subject.id]);
        const impossibleClass = calcResult && calcResult.status === 'impossible' ? 'status-impossible' : '';

        const avgText = currentAvg !== null ? currentAvg.toFixed(1) : '--';
        const avgColor = getScoreColor(currentAvg);
        const progressPct = currentAvg !== null ? Math.min(100, Math.max(0, currentAvg * 10)) : 0;
        const progressColor = currentAvg !== null ? avgColor : 'var(--border-subtle)';

        const hasTarget = subject.target !== null && subject.target !== undefined && subject.target !== '';
        const targetTickLeft = hasTarget ? Math.min(100, Math.max(0, Number(subject.target) * 10)) : 0;

        const bannerData = buildBannerData(subject, calcResult);
        const txLen = Array.isArray(subject.tx) ? subject.tx.length : 3;

        const txCellsHtml = subject.tx
          .map((_, idx) => renderScoreCellHTML(subject, 'tx', idx, `TX${idx + 1}`, calcResult))
          .join('');

        const gkCellHtml = renderScoreCellHTML(subject, 'gk', 0, 'Giữa kỳ', calcResult);
        const ckCellHtml = renderScoreCellHTML(subject, 'ck', 0, 'Cuối kỳ', calcResult);

        const presetsHtml = PRESET_TARGETS.map((preset) => {
          const isActive = hasTarget && Math.abs(Number(subject.target) - preset) < 0.001;
          return `
            <button
              type="button"
              class="preset-btn tabular ${isActive ? 'active' : ''}"
              data-action="set-preset-target"
              data-subject-id="${escapeHtml(subject.id)}"
              data-preset-target="${preset.toFixed(1)}"
            >
              ${preset.toFixed(1)}
            </button>
          `;
        }).join('');

        return `
          <article
            class="subject-card ${isCollapsed ? 'collapsed' : ''} ${impossibleClass}"
            data-subject-id="${escapeHtml(subject.id)}"
          >
            <!-- Card Header -->
            <div class="subject-header" data-action="toggle-collapse" data-subject-id="${escapeHtml(subject.id)}">
              <div class="subject-title-group">
                <div class="subject-name-row">
                  <h3 class="subject-name">${escapeHtml(subject.name)}</h3>
                  <span
                    class="target-pill tabular"
                    data-role="target-pill"
                    style="display: ${hasTarget ? 'inline-flex' : 'none'};"
                  >${hasTarget ? `Mục tiêu: ${Number(subject.target).toFixed(1)}` : ''}</span>
                </div>
                <div class="subject-meta tabular" data-role="subject-meta">
                  ${getFilledMetaText(subject)}
                </div>
              </div>

              <div class="subject-score-box">
                <span class="subject-avg tabular" data-role="subject-avg" style="color: ${avgColor};">${avgText}</span>
                <div class="chevron-btn" aria-hidden="true">
                  ${ICONS.chevronDown}
                </div>
              </div>
            </div>

            <!-- Mini Subject Progress Bar -->
            <div class="subject-progress">
              <div class="mini-track">
                <div
                  class="mini-fill"
                  data-role="mini-fill"
                  style="width: ${progressPct}%; background-color: ${progressColor};"
                ></div>
                <div
                  class="mini-tick"
                  data-role="mini-tick"
                  style="display: ${hasTarget ? 'block' : 'none'}; left: ${targetTickLeft}%;"
                ></div>
              </div>
            </div>

            <!-- Collapsible Body -->
            <div class="subject-body">
              <!-- Target Bar -->
              <div class="target-bar">
                <span class="target-label">Mục tiêu ĐTBm:</span>
                <div class="target-controls">
                  ${presetsHtml}
                  <input
                    type="text"
                    inputmode="decimal"
                    maxlength="4"
                    placeholder="Khác..."
                    class="custom-target-input tabular"
                    data-subject-id="${escapeHtml(subject.id)}"
                    value="${hasTarget ? formatScoreDisplay(subject.target) : ''}"
                    aria-label="Mục tiêu tùy chỉnh cho môn ${escapeHtml(subject.name)}"
                  />
                  <button
                    type="button"
                    class="preset-btn clear-btn"
                    data-action="clear-target"
                    data-subject-id="${escapeHtml(subject.id)}"
                    title="Xóa mục tiêu môn này"
                  >
                    Xóa
                  </button>
                </div>
              </div>

              <!-- Dynamic Status Banner -->
              <div
                class="${bannerData.className}"
                data-role="suggestion-banner"
                style="display: ${bannerData.visible ? 'flex' : 'none'};"
              >
                ${bannerData.html}
              </div>

              <!-- Score Columns Grid -->
              <div class="scores-layout">
                <!-- Thường xuyên (Hệ số 1) -->
                <div class="score-group">
                  <div class="score-group-header">
                    <div>
                      <span class="group-title">Thường xuyên</span>
                      <span class="weight-tag">Hệ số 1</span>
                    </div>
                    <div class="tx-actions">
                      <button
                        type="button"
                        class="mini-col-btn"
                        data-action="remove-tx"
                        data-subject-id="${escapeHtml(subject.id)}"
                        ${txLen <= 1 ? 'disabled' : ''}
                        title="Bớt 1 cột điểm Thường xuyên"
                      >&minus;</button>
                      <button
                        type="button"
                        class="mini-col-btn"
                        data-action="add-tx"
                        data-subject-id="${escapeHtml(subject.id)}"
                        ${txLen >= 8 ? 'disabled' : ''}
                        title="Thêm 1 cột điểm Thường xuyên (tối đa 8)"
                      >+</button>
                    </div>
                  </div>
                  <div class="score-cells-row">
                    ${txCellsHtml}
                  </div>
                </div>

                <!-- Định kỳ: Giữa kỳ (HS2) & Cuối kỳ (HS3) -->
                <div class="score-group">
                  <div class="score-group-header">
                    <div>
                      <span class="group-title">Định kỳ</span>
                      <span class="weight-tag">HS 2 &amp; HS 3</span>
                    </div>
                  </div>
                  <div class="exam-pair">
                    ${gkCellHtml}
                    ${ckCellHtml}
                  </div>
                </div>
              </div>

              <!-- Card Footer -->
              <div class="card-footer-actions">
                <button
                  type="button"
                  class="delete-subject-btn"
                  data-action="delete-subject"
                  data-subject-id="${escapeHtml(subject.id)}"
                >
                  ${ICONS.trash}
                  <span>Xóa môn ${escapeHtml(subject.name)}</span>
                </button>
              </div>
            </div>
          </article>
        `;
      }

      function renderAllSubjects() {
        const gridEl = document.getElementById('subjects-grid');
        if (!gridEl) return;

        const subjects = GradeEngine.getSubjects();
        if (!subjects || subjects.length === 0) {
          gridEl.innerHTML = `
            <div class="empty-state" style="grid-column: 1 / -1;">
              <p style="margin-bottom: 12px;">Chưa có môn học nào trong danh sách.</p>
              <button type="button" class="btn btn-emerald" id="btn-empty-restore">Khôi phục 8 môn mặc định</button>
            </div>
          `;
          const restoreBtn = document.getElementById('btn-empty-restore');
          if (restoreBtn) {
            restoreBtn.addEventListener('click', () => {
              GradeEngine.resetData();
              playSound('chime');
              renderAllSubjects();
              updateSemesterSummaryDOM();
            });
          }
          return;
        }

        gridEl.innerHTML = subjects.map((sub) => renderSubjectCardHTML(sub)).join('');
      }

      // Render lại đúng 1 card môn học khi thêm/bớt cột TX
      function rerenderSingleSubjectCard(subjectId) {
        const subject = GradeEngine.getSubjectById(subjectId);
        const card = document.querySelector(`.subject-card[data-subject-id="${CSS.escape(String(subjectId))}"]`);
        if (!subject || !card) return;
        const wrapper = document.createElement('div');
        wrapper.innerHTML = renderSubjectCardHTML(subject).trim();
        const newCard = wrapper.firstElementChild;
        if (newCard) {
          card.replaceWith(newCard);
        }
      }

      // =========================================================================
      // AUTO-ADVANCE (TỰ ĐỘNG NHẢY SANG Ô TRỐNG TIẾP THEO TRONG MÔN)
      // =========================================================================

      function focusNextScoreInput(currentInput) {
        const card = currentInput.closest('.subject-card');
        if (!card) return;
        const inputs = Array.from(card.querySelectorAll('.score-input'));
        const idx = inputs.indexOf(currentInput);
        if (idx === -1) return;

        // Ưu tiên nhảy tới ô trống tiếp theo trong cùng môn học
        for (let i = idx + 1; i < inputs.length; i++) {
          if (!inputs[i].value.trim()) {
            inputs[i].focus();
            inputs[i].select();
            return;
          }
        }
        // Nếu các ô phía sau đã có điểm, nhảy sang ô kế tiếp
        if (idx + 1 < inputs.length) {
          inputs[idx + 1].focus();
          inputs[idx + 1].select();
        } else {
          currentInput.blur();
        }
      }

      // =========================================================================
      // XỬ LÝ SỰ KIỆN NHẬP ĐIỂM TỨC THÌ (REAL-TIME INPUT & BLUR)
      // =========================================================================

      function handleScoreInputEvent(e) {
        const input = e.target;
        if (!input.classList.contains('score-input')) return;

        const subjectId = input.getAttribute('data-subject-id');
        const type = input.getAttribute('data-score-type');
        const txIndex = parseInt(input.getAttribute('data-tx-index') || '0', 10);
        const raw = input.value;
        const trimmed = raw.trim();

        // Trường hợp người dùng xóa trắng ô điểm
        if (trimmed === '') {
          GradeEngine.updateScore(subjectId, type, null, txIndex);
          playSound('clear');
          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();
          return;
        }

        const parsed = GradeEngine.parseQuickInput(trimmed);
        if (parsed === null) {
          return;
        }

        const prevSubjectState = GradeEngine.getSubjectById(subjectId);
        const prevCalc = prevSubjectState
          ? GradeEngine.calculateTargetSuggestions(prevSubjectState, uiState.useRoundingBuffer)
          : null;
        const wasAchieved = prevCalc && prevCalc.status === 'achieved';

        // Lưu ngầm vào Engine ngay từ chữ số đầu tiên
        GradeEngine.updateScore(subjectId, type, parsed, txIndex);

        const updatedSubject = GradeEngine.getSubjectById(subjectId);
        const newCalc = updatedSubject
          ? GradeEngine.calculateTargetSuggestions(updatedSubject, uiState.useRoundingBuffer)
          : null;
        const isNowAchieved = newCalc && newCalc.status === 'achieved';

        if (!wasAchieved && isNowAchieved) {
          playSound('chime');
        } else {
          playSound('input');
        }

        // Cập nhật DOM tại chỗ mà không làm mất focus ô đang gõ
        patchSubjectCardDOM(subjectId, { syncInputValues: false });
        updateSemesterSummaryDOM();

        // Kiểm tra điều kiện Auto-advance khi gõ đủ 2 chữ số không dấu chấm (VD: "85" -> 8.5, "10" -> 10)
        // hoặc gõ xong 1 chữ số sau dấu chấm thập phân (VD: "8.5")
        const digitsOnly = trimmed.replace(/[.,]/g, '');
        const hasDecimalSeparator = /[.,]/.test(trimmed);
        const endsWithSeparator = /[.,]$/.test(trimmed);

        const shouldAutoFormatAndAdvance =
          (!hasDecimalSeparator && digitsOnly.length >= 2 && trimmed !== '1') ||
          (hasDecimalSeparator && !endsWithSeparator && trimmed.split(/[.,]/)[1].length >= 1 && digitsOnly.length >= 2);

        if (shouldAutoFormatAndAdvance) {
          input.value = formatScoreDisplay(parsed);
          focusNextScoreInput(input);
        }
      }

      function handleScoreBlurEvent(e) {
        const input = e.target;
        if (!input.classList.contains('score-input')) return;

        const subjectId = input.getAttribute('data-subject-id');
        const type = input.getAttribute('data-score-type');
        const txIndex = parseInt(input.getAttribute('data-tx-index') || '0', 10);
        const trimmed = input.value.trim();

        if (trimmed === '') {
          GradeEngine.updateScore(subjectId, type, null, txIndex);
          input.value = '';
        } else {
          const parsed = GradeEngine.parseQuickInput(trimmed);
          if (parsed !== null) {
            GradeEngine.updateScore(subjectId, type, parsed, txIndex);
            input.value = formatScoreDisplay(parsed);
          } else {
            // Khôi phục lại giá trị hợp lệ trước đó trong state
            const sub = GradeEngine.getSubjectById(subjectId);
            const fallbackVal = sub ? (type === 'tx' ? sub.tx[txIndex] : sub[type]) : null;
            input.value = fallbackVal !== null && fallbackVal !== undefined ? formatScoreDisplay(fallbackVal) : '';
          }
        }

        patchSubjectCardDOM(subjectId, { syncInputValues: false });
        updateSemesterSummaryDOM();
      }

      function handleScoreKeydownEvent(e) {
        const input = e.target;
        if (!input.classList.contains('score-input')) return;

        if (e.key === 'Enter') {
          e.preventDefault();
          const parsed = GradeEngine.parseQuickInput(input.value.trim());
          if (parsed !== null) {
            input.value = formatScoreDisplay(parsed);
          }
          focusNextScoreInput(input);
        }
      }

      // =========================================================================
      // XỬ LÝ Ô NHẬP MỤC TIÊU TÙY CHỈNH (CUSTOM TARGET INPUT)
      // =========================================================================

      function handleCustomTargetInput(e) {
        const input = e.target;
        if (!input.classList.contains('custom-target-input')) return;

        const subjectId = input.getAttribute('data-subject-id');
        const trimmed = input.value.trim();

        if (trimmed === '') {
          GradeEngine.updateTarget(subjectId, null);
          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();
          return;
        }

        const parsed = GradeEngine.parseQuickInput(trimmed);
        if (parsed !== null && parsed > 0 && parsed <= 10) {
          GradeEngine.updateTarget(subjectId, parsed);
          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();
        }
      }

      function handleCustomTargetBlur(e) {
        const input = e.target;
        if (!input.classList.contains('custom-target-input')) return;

        const subjectId = input.getAttribute('data-subject-id');
        const sub = GradeEngine.getSubjectById(subjectId);
        if (sub && sub.target !== null) {
          input.value = formatScoreDisplay(sub.target);
        } else {
          input.value = '';
        }
      }

      // =========================================================================
      // XỬ LÝ CÁC NÚT BẤM TRONG THẺ MÔN HỌC (EVENT DELEGATION)
      // =========================================================================

      function handleSubjectsGridClick(e) {
        const actionEl = e.target.closest('[data-action]');
        if (!actionEl) return;

        const action = actionEl.getAttribute('data-action');
        const subjectId = actionEl.getAttribute('data-subject-id');

        if (action === 'toggle-collapse') {
          // Không thu gọn nếu người dùng bấm vào các nút con
          if (e.target.closest('button') || e.target.closest('input')) return;
          const card = actionEl.closest('.subject-card');
          if (!card) return;
          const isCollapsed = card.classList.toggle('collapsed');
          uiState.collapsedMap[subjectId] = isCollapsed;
          saveUiPrefs();
          playSound('click');
          return;
        }

        if (action === 'set-preset-target') {
          const presetVal = parseFloat(actionEl.getAttribute('data-preset-target'));
          const sub = GradeEngine.getSubjectById(subjectId);
          if (!sub) return;

          // Nếu bấm lại vào mức mục tiêu đang chọn thì tắt mục tiêu
          if (sub.target !== null && Math.abs(Number(sub.target) - presetVal) < 0.001) {
            GradeEngine.updateTarget(subjectId, null);
            playSound('clear');
          } else {
            GradeEngine.updateTarget(subjectId, presetVal);
            playSound('click');
          }

          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();
          return;
        }

        if (action === 'clear-target') {
          GradeEngine.updateTarget(subjectId, null);
          playSound('clear');
          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();
          return;
        }

        if (action === 'toggle-lock') {
          e.stopPropagation();
          const type = actionEl.getAttribute('data-score-type');
          const txIndex = parseInt(actionEl.getAttribute('data-tx-index') || '0', 10);
          const suggestedAttr = actionEl.getAttribute('data-suggested-score');
          const lockedScore = suggestedAttr !== null && suggestedAttr !== '' ? parseFloat(suggestedAttr) : null;

          const isNowLocked = GradeEngine.toggleLock(subjectId, type, txIndex, lockedScore);
          playSound('lock');

          patchSubjectCardDOM(subjectId, { syncInputValues: false });
          updateSemesterSummaryDOM();

          if (isNowLocked && lockedScore !== null) {
            showToast(`Đã khóa điểm dự đoán ${lockedScore.toFixed(1)}`);
          }
          return;
        }

        if (action === 'add-tx') {
          GradeEngine.addTxColumn(subjectId);
          playSound('click');
          rerenderSingleSubjectCard(subjectId);
          updateSemesterSummaryDOM();
          return;
        }

        if (action === 'remove-tx') {
          GradeEngine.removeTxColumn(subjectId);
          playSound('clear');
          rerenderSingleSubjectCard(subjectId);
          updateSemesterSummaryDOM();
          return;
        }

        if (action === 'delete-subject') {
          const sub = GradeEngine.getSubjectById(subjectId);
          if (!sub) return;
          const confirmed = window.confirm(`Bạn có chắc muốn xóa môn "${sub.name}" khỏi bảng điểm?`);
          if (!confirmed) return;

          const remaining = GradeEngine.getSubjects().filter((s) => String(s.id) !== String(subjectId));
          GradeEngine.saveSubjects(remaining);
          playSound('clear');
          renderAllSubjects();
          updateSemesterSummaryDOM();
          showToast(`Đã xóa môn ${sub.name}`);
        }
      }

      // =========================================================================
      // MODALS & CÁC NÚT ĐIỀU KHIỂN CHUNG
      // =========================================================================

      function openModal(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        modal.classList.add('open');
        playSound('click');
      }

      function closeModal(modalId) {
        const modal = document.getElementById(modalId);
        if (!modal) return;
        modal.classList.remove('open');
      }

      function initGlobalEvents() {
        const gridEl = document.getElementById('subjects-grid');
        if (gridEl) {
          gridEl.addEventListener('input', (e) => {
            if (e.target.classList.contains('score-input')) {
              handleScoreInputEvent(e);
            } else if (e.target.classList.contains('custom-target-input')) {
              handleCustomTargetInput(e);
            }
          });

          gridEl.addEventListener(
            'blur',
            (e) => {
              if (e.target.classList.contains('score-input')) {
                handleScoreBlurEvent(e);
              } else if (e.target.classList.contains('custom-target-input')) {
                handleCustomTargetBlur(e);
              }
            },
            true
          );

          gridEl.addEventListener('keydown', handleScoreKeydownEvent);
          gridEl.addEventListener('click', handleSubjectsGridClick);
        }

        // Bật / tắt âm thanh
        const soundBtn = document.getElementById('btn-sound-toggle');
        if (soundBtn) {
          soundBtn.addEventListener('click', () => {
            uiState.soundEnabled = !uiState.soundEnabled;
            saveUiPrefs();
            updateSoundButtonUI();
            if (uiState.soundEnabled) playSound('click');
            showToast(uiState.soundEnabled ? 'Đã bật âm thanh phản hồi' : 'Đã tắt âm thanh');
          });
        }

        // Bật / tắt đệm làm tròn (-0.05)
        const roundingToggle = document.getElementById('rounding-toggle');
        if (roundingToggle) {
          const toggleAction = () => {
            uiState.useRoundingBuffer = !uiState.useRoundingBuffer;
            saveUiPrefs();
            updateRoundingToggleUI();
            playSound('click');

            // Cập nhật tại chỗ toàn bộ các môn học theo chế độ làm tròn mới
            const subjects = GradeEngine.getSubjects();
            subjects.forEach((s) => patchSubjectCardDOM(s.id, { syncInputValues: false }));
            updateSemesterSummaryDOM();
          };

          roundingToggle.addEventListener('click', toggleAction);
          roundingToggle.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              toggleAction();
            }
          });
        }

        // Mở Modal Thêm môn học
        const btnOpenAdd = document.getElementById('btn-open-add-subject');
        if (btnOpenAdd) {
          btnOpenAdd.addEventListener('click', () => {
            openModal('add-subject-modal');
            const nameInput = document.getElementById('new-subject-name');
            if (nameInput) {
              nameInput.value = '';
              setTimeout(() => nameInput.focus(), 60);
            }
          });
        }

        // Xử lý Form Thêm môn học
        const addForm = document.getElementById('add-subject-form');
        if (addForm) {
          addForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const nameInput = document.getElementById('new-subject-name');
            const txCountInput = document.getElementById('new-subject-tx-count');
            const name = nameInput ? nameInput.value.trim() : '';
            const txCount = txCountInput ? parseInt(txCountInput.value, 10) || 3 : 3;

            if (!name) return;

            const newId = 'sub_' + Date.now().toString(36);
            const newSubject = GradeEngine.createSubject(newId, name, txCount);
            const currentList = GradeEngine.getSubjects();
            currentList.push(newSubject);
            GradeEngine.saveSubjects(currentList);

            closeModal('add-subject-modal');
            playSound('chime');
            renderAllSubjects();
            updateSemesterSummaryDOM();
            showToast(`Đã thêm môn ${name}`);
          });
        }

        // Mở Modal Sao lưu
        const btnOpenBackup = document.getElementById('btn-open-backup');
        if (btnOpenBackup) {
          btnOpenBackup.addEventListener('click', () => {
            const textarea = document.getElementById('backup-code-textarea');
            if (textarea) {
              textarea.value = GradeEngine.exportDataBase64();
            }
            openModal('backup-modal');
          });
        }

        // Copy mã sao lưu
        const btnExportCode = document.getElementById('btn-export-code');
        if (btnExportCode) {
          btnExportCode.addEventListener('click', async () => {
            const code = GradeEngine.exportDataBase64();
            const textarea = document.getElementById('backup-code-textarea');
            if (textarea) {
              textarea.value = code;
              textarea.select();
            }
            try {
              if (navigator.clipboard && navigator.clipboard.writeText) {
                await navigator.clipboard.writeText(code);
              } else {
                document.execCommand('copy');
              }
              playSound('chime');
              showToast('Đã sao chép mã sao lưu vào bộ nhớ tạm!');
            } catch (err) {
              showToast('Đã tạo mã, hãy nhấn giữ để sao chép.');
            }
          });
        }

        // Khôi phục từ mã sao lưu
        const btnImportCode = document.getElementById('btn-import-code');
        if (btnImportCode) {
          btnImportCode.addEventListener('click', () => {
            const textarea = document.getElementById('backup-code-textarea');
            const rawCode = textarea ? textarea.value.trim() : '';
            try {
              GradeEngine.importDataBase64(rawCode);
              closeModal('backup-modal');
              playSound('chime');
              renderAllSubjects();
              updateSemesterSummaryDOM();
              showToast('Khôi phục dữ liệu bảng điểm thành công!');
            } catch (err) {
              playSound('clear');
              alert(err.message || 'Mã sao lưu không hợp lệ.');
            }
          });
        }

        // Reset về 8 môn mặc định
        const btnResetAll = document.getElementById('btn-reset-all');
        if (btnResetAll) {
          btnResetAll.addEventListener('click', () => {
            const ok = window.confirm('Bạn có chắc chắn muốn xóa toàn bộ điểm đã nhập và khôi phục về 8 môn mặc định?');
            if (!ok) return;
            GradeEngine.resetData();
            uiState.collapsedMap = {};
            saveUiPrefs();
            closeModal('backup-modal');
            playSound('clear');
            renderAllSubjects();
            updateSemesterSummaryDOM();
            showToast('Đã đặt lại dữ liệu về mặc định');
          });
        }

        // Đóng Modal khi nhấn nút đóng hoặc vùng nền mờ
        document.querySelectorAll('[data-close-modal]').forEach((btn) => {
          btn.addEventListener('click', () => {
            const targetId = btn.getAttribute('data-close-modal');
            closeModal(targetId);
          });
        });

        document.querySelectorAll('.modal-backdrop').forEach((backdrop) => {
          backdrop.addEventListener('click', (e) => {
            if (e.target === backdrop) {
              backdrop.classList.remove('open');
            }
          });
        });
      }

      // Khởi chạy ứng dụng
      function bootstrap() {
        loadUiPrefs();
        updateSoundButtonUI();
        updateRoundingToggleUI();
        renderAllSubjects();
        updateSemesterSummaryDOM();
        initGlobalEvents();
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
